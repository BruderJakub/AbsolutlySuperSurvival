<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Profile</h1>
    <p>This is your profile page.</p>
    <div id="profile-data"></div>
    <button>
        <div>
            <h2>Profile 1</h2>
            <p>This is your profile 1.</p>
            <img src="../assets/profile1.png" alt="Profile 1 Image" width="100" height="100">
            <div id="profile-data-1"></div>
        </div>
    </button>
    <button>
        <div>
            <h2>Profile 2</h2>
            <p>This is your profile 2.</p>
            <img src="../assets/profile2.png" alt="Profile 2 Image" width="100" height="100">
            <div id="profile-data-2"></div>
        </div>
    </button>
    <button>
        <div>
            <h2>Profile 3</h2>
            <p>This is your profile 3.</p>
            <img src="../assets/profile3.png" alt="Profile 3 Image" width="100" height="100">
            <div id="profile-data-3"></div>
        </div>
    </button>

    <button onclick="window.location.href='../index.html'">Back to Home</button>
</body>

<script>
    async function fetchProfileData() {
        try {
            const response = await fetch('/profile');
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            const data = await response.json();
            const profileData = document.getElementById('profile-data');
            profileData.replaceChildren();

            data.profile.forEach((profile) => {
                const profileElement = document.createElement('p');
                profileElement.textContent = `${profile.name} - Level ${profile.level} - Money: ${profile.money}`;
                profileData.appendChild(profileElement);
            });
            console.log(data);
        } catch (error) {
            console.error('There has been a problem with your fetch operation:', error);
        }
    }

    async function getSingleProfileData(profileID) {
        try {
            const response = await fetch(`/profile/${profileID}`);
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            const data = await response.json();
            const profileData = document.getElementById(`profile-data-${profileID}`);
            profileData.replaceChildren();

            data.profile.forEach((profile) => {
                const profileElement = document.createElement('p');
                profileElement.textContent = `${profile.name} - Level ${profile.level} - Money: ${profile.money}`;
                profileData.appendChild(profileElement);
            });
            console.log(data);
        } catch (error) {
            console.error('There has been a problem with your fetch operation:', error);
        }
    }

    // Call the function when the page loads
    window.onload = fetchProfileData;
    window.onload = getSingleProfileData(1);
    window.onload = getSingleProfileData(2);
    window.onload = getSingleProfileData(3);
</script>
</html>
